name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly, to catch new requirements from Home Assistant and HACS
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The integration isn't in home-assistant/brands
          ignore: brands
